name: Compile Kernel - POCO F5 (Marble)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source repo URL for marble (Melt Kernel). Paste any git URL here to override the default."
        required: true
        type: choice
        default: "https://github.com/yudharn/Pzqqt-Melt-Rebase"
        options:
          - https://github.com/yudharn/Pzqqt-Melt-Rebase

      kernel_branch:
        description: "Branch on kernel_source above"
        required: true
        type: choice
        default: "Yudharn-melt-rebase"
        options:
          - melt-rebase
          - Yudharn-melt-rebase

      manager_official_kernelsu:
        description: "Build Official-KernelSU"
        required: true
        type: boolean
        default: true

      manager_kernelsu_next:
        description: "Build KernelSU-Next"
        required: true
        type: boolean
        default: true

      manager_bakasu:
        description: "Build BakaSU"
        required: true
        type: boolean
        default: true

      manager_vanilla:
        description: "Build Vanilla (no KernelSU manager, no SuSFS; DroidSpaces, NoMount, BBG, Re-Kernel Netlink + eBPF always ON; built once, ignores Full/Core)"
        required: true
        type: boolean
        default: true

      custom_name:
        description: "kernel"
        required: false
        type: choice
        default: Melt-Rebase
        options:
          - Melt-Rebase
          
      full_build:
        description: "Full build — enable ALL features (SuSFS, NoMount, BBG, Re-Kernel Netlink, Re-Kernel eBPF, DroidSpaces)"
        required: true
        type: boolean
        default: true

      core_build:
        description: "Core build — the essentials (SuSFS, NoMount, Re-Kernel Netlink, Re-Kernel eBPF); BBG and DroidSpaces stay off"
        required: true
        type: boolean
        default: true

      susfs_commit:
        description: "Custom susfs4ksu commit, Leave empty to use the latest commit on gki-android12-5.10."
        required: false
        type: string
        default: ""

      nomount_commit:
        description: "Custom NoMount commit or tag. Leave empty to use the latest commit on master."
        required: false
        type: string
        default: ""

      include_manager_apk:
        description: "Attach the matching manager APK (latest successful CI build of each manager) to the release"
        required: true
        type: boolean
        default: true

      ccache_update:
        description: "Refresh ccache"
        required: true
        type: boolean
        default: true


jobs:
  Determine_Matrix:
    name: Determine which builds to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON from checked managers and modes
        id: set-matrix
        run: |
          MANAGERS=()
          [[ "${{ inputs.manager_official_kernelsu }}" == true ]] && MANAGERS+=("Official-KernelSU")
          [[ "${{ inputs.manager_kernelsu_next }}" == true ]] && MANAGERS+=("KernelSU-Next")
          [[ "${{ inputs.manager_bakasu }}" == true ]] && MANAGERS+=("BakaSU")

          VANILLA=false
          [[ "${{ inputs.manager_vanilla }}" == true ]] && VANILLA=true

          if [[ ${#MANAGERS[@]} -eq 0 && "$VANILLA" != true ]]; then
            echo "::error::Nothing checked — tick at least one manager_* checkbox (or manager_vanilla) before running this workflow."
            exit 1
          fi

          MODES=()
          [[ "${{ inputs.full_build }}" == true ]] && MODES+=("FULL")
          [[ "${{ inputs.core_build }}" == true ]] && MODES+=("CORE")

          # Modes only matter for the KernelSU managers; Vanilla is built once with all features.
          if [[ ${#MANAGERS[@]} -gt 0 && ${#MODES[@]} -eq 0 ]]; then
            echo "::error::Neither Full nor Core is ticked — tick at least one build mode when building a KernelSU manager."
            exit 1
          fi

          ENTRIES=()
          for m in "${MANAGERS[@]}"; do
            for mode in "${MODES[@]}"; do
              ENTRIES+=("${m}|${mode}")
            done
          done
          [[ "$VANILLA" == true ]] && ENTRIES+=("Vanilla|ALL")

          MATRIX_JSON=$(printf '%s\n' "${ENTRIES[@]}" | jq -R 'split("|") | {ksu_type: .[0], build_mode: .[1]}' | jq -sc .)
          echo "==> Builds selected for this run: ${ENTRIES[*]}"
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  Resolve_Toolchain:
    needs: Determine_Matrix
    name: Resolve latest LLVM/Clang release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      llvm_tag: ${{ steps.resolve.outputs.llvm_tag }}
      clang_url: ${{ steps.resolve.outputs.clang_url }}
      clang_archive: ${{ steps.resolve.outputs.clang_archive }}
    steps:
      - name: Query GitHub API (authenticated, with retry)
        id: resolve
        run: |
          set -euo pipefail

          echo "==> Querying latest stable LLVM release..."

          LLVM_JSON=""
          for attempt in 1 2 3; do
            if LLVM_JSON=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/llvm/llvm-project/releases/latest); then
              break
            fi
            echo "::warning::GitHub API call failed (attempt ${attempt}/3), retrying in 5s..."
            sleep 5
          done

          if [[ -z "$LLVM_JSON" ]]; then
            echo "::error::Could not reach the GitHub API after 3 attempts."
            exit 1
          fi

          LLVM_TAG=$(echo "$LLVM_JSON" | jq -r '.tag_name')

          CLANG_URL=$(echo "$LLVM_JSON" | jq -r '
            .assets[]
            | select(.name | test("Linux-X64\\.tar\\.xz$"))
            | .browser_download_url
          ' | head -n 1)

          if [[ -z "$LLVM_TAG" || "$LLVM_TAG" == "null" ]]; then
            echo "::error::Failed to determine latest LLVM release tag."
            exit 1
          fi

          if [[ -z "$CLANG_URL" || "$CLANG_URL" == "null" ]]; then
            echo "::error::Could not find Linux-X64.tar.xz asset in LLVM release ${LLVM_TAG}."
            echo "Available assets:"
            echo "$LLVM_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          CLANG_ARCHIVE=$(basename "$CLANG_URL")

          echo "llvm_tag=${LLVM_TAG}" >> "$GITHUB_OUTPUT"
          echo "clang_url=${CLANG_URL}" >> "$GITHUB_OUTPUT"
          echo "clang_archive=${CLANG_ARCHIVE}" >> "$GITHUB_OUTPUT"

          echo "==> Latest LLVM release: ${LLVM_TAG}"

  Build_Kernel_Marble:
    needs: [Determine_Matrix, Resolve_Toolchain]
    name: Build Kernel (${{ matrix.ksu_type }} / ${{ matrix.build_mode }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Determine_Matrix.outputs.matrix) }}
    env:
        GH_TOKEN: ${{ github.token }}
        SOC: marble
        CCACHE_KEY: ccache-ecsv3-marble-sm7475
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - name: Free up disk space
        run: |
          echo "==> Disk space before cleanup:"
          df -h /

          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc /usr/local/.ghcup &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /opt/az &
          sudo rm -rf /usr/share/swift &
          wait

          sudo docker image prune --all --force >/dev/null 2>&1 || true

          echo "==> Disk space after cleanup:"
          df -h /

      - uses: actions/checkout@v7

      - name: Resolve feature set for this leg
        run: |
          # Vanilla always gets every feature (except SuSFS); KernelSU legs follow FULL/CORE.
          if [[ "${{ matrix.ksu_type }}" == "Vanilla" || "${{ matrix.build_mode }}" == "FULL" ]]; then
            SUSFS=true
            NOMOUNT=true
            BBG=true
            REKERNEL_NETLINK=true
            REKERNEL_EBPF=true
            DROIDSPACES=true
          else
            SUSFS=true
            NOMOUNT=true
            BBG=false
            REKERNEL_NETLINK=true
            REKERNEL_EBPF=true
            DROIDSPACES=false
          fi
          # Vanilla has no KernelSU, so SuSFS is never built in
          [[ "${{ matrix.ksu_type }}" == "Vanilla" ]] && SUSFS=false
          echo "SUSFS=${SUSFS}" >> $GITHUB_ENV
          echo "NOMOUNT=${NOMOUNT}" >> $GITHUB_ENV
          echo "BBG=${BBG}" >> $GITHUB_ENV
          echo "REKERNEL_NETLINK=${REKERNEL_NETLINK}" >> $GITHUB_ENV
          echo "REKERNEL_EBPF=${REKERNEL_EBPF}" >> $GITHUB_ENV
          echo "DROIDSPACES=${DROIDSPACES}" >> $GITHUB_ENV
          echo "==> [${{ matrix.ksu_type }} / ${{ matrix.build_mode }}] susfs=${SUSFS} nomount=${NOMOUNT} bbg=${BBG} rekernel_netlink=${REKERNEL_NETLINK} rekernel_ebpf=${REKERNEL_EBPF} droidspaces=${DROIDSPACES}"

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          lz4 \
          git \
          python3 \
          curl \
          dwarves \
          cpio \
          ccache \
          zstd \
          unzip \
          p7zip-full \
          gcc-aarch64-linux-gnu

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_source }} ${SOC}
          cd ${SOC}
          KERNEL_COMMIT=$(git rev-parse --short HEAD)
          echo "KERNEL_COMMIT=${KERNEL_COMMIT}" >> $GITHUB_ENV
          KERNEL_SOURCE_WEB="${{ inputs.kernel_source }}"
          KERNEL_SOURCE_WEB="${KERNEL_SOURCE_WEB%.git}"
          KERNEL_COMMIT_URL="${KERNEL_SOURCE_WEB}/commit/${KERNEL_COMMIT}"
          echo "KERNEL_COMMIT_URL=${KERNEL_COMMIT_URL}" >> $GITHUB_ENV
          echo "==> Kernel source: using latest commit ${KERNEL_COMMIT} on branch ${{ inputs.kernel_branch }} (${KERNEL_COMMIT_URL})"

          KVER=$(grep -m1 '^VERSION = ' Makefile | awk '{print $3}')
          KPATCHLEVEL=$(grep -m1 '^PATCHLEVEL = ' Makefile | awk '{print $3}')
          KSUBLEVEL=$(grep -m1 '^SUBLEVEL = ' Makefile | awk '{print $3}')
          if [[ -n "$KVER" && -n "$KPATCHLEVEL" && -n "$KSUBLEVEL" ]]; then
            KERNEL_BASE_VERSION="${KVER}.${KPATCHLEVEL}.${KSUBLEVEL}"
          else
            KERNEL_BASE_VERSION="unknown"
          fi
          echo "KERNEL_BASE_VERSION=${KERNEL_BASE_VERSION}" >> $GITHUB_ENV
          echo "==> Detected kernel base version: ${KERNEL_BASE_VERSION}"
          cd ..

      - name: Use resolved LLVM/Clang release
        run: |
          echo "LLVM_TAG=${{ needs.Resolve_Toolchain.outputs.llvm_tag }}" >> "$GITHUB_ENV"
          echo "CLANG_URL=${{ needs.Resolve_Toolchain.outputs.clang_url }}" >> "$GITHUB_ENV"
          echo "CLANG_ARCHIVE=${{ needs.Resolve_Toolchain.outputs.clang_archive }}" >> "$GITHUB_ENV"
          echo "==> Using LLVM release: ${{ needs.Resolve_Toolchain.outputs.llvm_tag }}"

      - name: Restore cached Clang/LLVM toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: toolchains/llvm-toolchain
          key: llvm-toolchain-${{ needs.Resolve_Toolchain.outputs.llvm_tag }}

      - name: Download & extract Clang/LLVM toolchain (cache miss only)
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          echo "==> Cache miss for ${LLVM_TAG} — downloading from ${CLANG_URL}"
          mkdir -p toolchains
          cd toolchains
          wget -q "$CLANG_URL" -O "$CLANG_ARCHIVE"
          mkdir llvm-toolchain
          tar -xJf "$CLANG_ARCHIVE" -C llvm-toolchain --strip-components=1 >/dev/null 2>&1
          rm -f "$CLANG_ARCHIVE"

      - name: Save Clang/LLVM toolchain to cache
        if: ${{ always() && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: toolchains/llvm-toolchain
          key: llvm-toolchain-${{ needs.Resolve_Toolchain.outputs.llvm_tag }}

      - name: Report Clang/LLVM toolchain
        id: clang
        run: |
          echo "==> Using Clang/LLVM toolchain: ${LLVM_TAG} (cache-hit: ${{ steps.toolchain-cache.outputs.cache-hit }})"
          toolchains/llvm-toolchain/bin/clang --version

      - name: Configure ccache dir and key
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_marble" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          if [[ "${{ env.DROIDSPACES }}" == true ]]; then
            CCACHE_REAL_KEY=${CCACHE_KEY}-Droidspaces
          else
            CCACHE_REAL_KEY=${CCACHE_KEY}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: Purge old ccache (on refresh)
        if: ${{ inputs.ccache_update }}
        continue-on-error: true
        run: |
          echo "Deleting old repo ccache to force a fresh save..."
          gh cache delete "${CCACHE_REAL_KEY}-${{ runner.os }}-${{ inputs.kernel_branch }}-${{ matrix.ksu_type }}" -R ${{ github.repository }} || echo "No old ccache to delete"

      - name: Restore ccache
        if: ${{ !inputs.ccache_update }}
        uses: actions/cache/restore@v6
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}-${{ matrix.ksu_type }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: Compile Kernel
        run: |
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/llvm-toolchain/bin"
          export PATH="${CLANG_ROOT}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="${CLANG_ROOT}/clang"
          export CXX="${CLANG_ROOT}/clang++"
          export HOSTCC="${CLANG_ROOT}/clang"
          export HOSTCXX="${CLANG_ROOT}/clang++"
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export KBUILD_BUILD_USER="Rebuild By"
          export KBUILD_BUILD_HOST="Yudharn"

          CLANG_VERSION=$("${CC}" --version | head -n1)
          echo "CLANG_VERSION=${CLANG_VERSION}" >> $GITHUB_ENV
          echo "==> Using Clang/LLVM toolchain: ${CLANG_VERSION} (${LLVM_TAG})"
          echo "==> LLVM archive: ${CLANG_ARCHIVE}"
          echo "==> LLVM URL: ${CLANG_URL}"

          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          mkdir -p "${CCACHE_DIR}"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "${CCACHE_DIR}/ccache.conf"
          ccache -M "${CCACHE_MAXSIZE}"
          ccache -o compression=true
          echo "ccache status before build:"
          ccache -s

          if [[ -n "${{ inputs.custom_name }}" ]]; then
            KERNEL_NAME="${{ inputs.custom_name }}"
          else
            KERNEL_NAME="${{ matrix.ksu_type }}"
          fi

          echo "KERNEL_NAME=${KERNEL_NAME}" >> $GITHUB_ENV

          cd ${SOC}

          KSU_DIRS_BEFORE=$(ls -d */ 2>/dev/null | sort || true)

          case "${{ matrix.ksu_type }}" in

            "Vanilla")
              # No KernelSU manager at all
              ;;

            "Official-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
              ;;

            "KernelSU-Next")
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              ;;

            "BakaSU")
              curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/sync-susfs/kernel/setup.sh" | bash -s sync-susfs
              ;;

          esac

          if [[ "${{ matrix.ksu_type }}" != "Vanilla" ]]; then
            KSU_DIRS_AFTER=$(ls -d */ 2>/dev/null | sort || true)
            KSU_DIR=$(comm -13 <(echo "$KSU_DIRS_BEFORE") <(echo "$KSU_DIRS_AFTER") | head -n1 | sed 's:/$::')

            if [[ -n "$KSU_DIR" && -d "${KSU_DIR}/.git" ]]; then
              KSU_MANAGER_COMMIT=$(cd "$KSU_DIR" && git rev-parse --short HEAD 2>/dev/null || echo "")
              KSU_MANAGER_SHA=$(cd "$KSU_DIR" && git rev-parse HEAD 2>/dev/null || echo "")
              echo "KSU_MANAGER_SHA=${KSU_MANAGER_SHA}" >> $GITHUB_ENV
              KSU_MANAGER_REPO_URL=$(cd "$KSU_DIR" && git remote get-url origin 2>/dev/null | sed 's/\.git$//')
              KSU_MANAGER_COMMIT_URL="${KSU_MANAGER_REPO_URL}/commit/${KSU_MANAGER_COMMIT}"

              # Each fork computes its own version code in kernel/Kbuild (KSU_VERSION),
              # this mirrors that formula so the release notes match what the manager
              # app itself reports, e.g. BakaSU shows "v4.2.0-rc1 (35119)".
              KSU_REV_COUNT=$(cd "$KSU_DIR" && git rev-list --count HEAD 2>/dev/null || echo "")
              KSU_TAG=""
              KSU_CODE=""

              case "${{ matrix.ksu_type }}" in
                "Official-KernelSU")
                  KSU_TAG=$(cd "$KSU_DIR" && git describe --tags --always 2>/dev/null || echo "")
                  [[ -n "$KSU_REV_COUNT" ]] && KSU_CODE=$((30000 + KSU_REV_COUNT))
                  ;;
                "KernelSU-Next")
                  KSU_TAG=$(cd "$KSU_DIR" && git describe --tags --abbrev=0 2>/dev/null || echo "")
                  [[ -n "$KSU_REV_COUNT" ]] && KSU_CODE=$((30000 + KSU_REV_COUNT))
                  ;;
                *)
                  KSU_TAG=$(cd "$KSU_DIR" && git describe --tags --always 2>/dev/null || echo "")
                  ;;
              esac

              if [[ -n "$KSU_TAG" && -n "$KSU_CODE" ]]; then
                KSU_MANAGER_VERSION="${KSU_TAG} (${KSU_CODE})"
              elif [[ -n "$KSU_TAG" ]]; then
                KSU_MANAGER_VERSION="$KSU_TAG"
              else
                KSU_MANAGER_VERSION="unknown"
              fi

              echo "==> ${{ matrix.ksu_type }}: detected source dir '${KSU_DIR}', version ${KSU_MANAGER_VERSION} (${KSU_MANAGER_COMMIT}) - ${KSU_MANAGER_COMMIT_URL}"
            else
              echo "==> Could not auto-detect the ${{ matrix.ksu_type }} source dir; KSU Manager version will show as unknown."
              KSU_MANAGER_VERSION="unknown"
              KSU_MANAGER_COMMIT=""
              KSU_MANAGER_COMMIT_URL=""
            fi

            echo "KSU_MANAGER_VERSION=${KSU_MANAGER_VERSION}" >> $GITHUB_ENV
            echo "KSU_MANAGER_COMMIT=${KSU_MANAGER_COMMIT}" >> $GITHUB_ENV
            echo "KSU_MANAGER_COMMIT_URL=${KSU_MANAGER_COMMIT_URL}" >> $GITHUB_ENV
          fi

          if [[ "${{ env.SUSFS }}" == true ]]; then
            if [[ -n "${{ inputs.susfs_commit }}" ]]; then
              git clone -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
              cd susfs
              git checkout "${{ inputs.susfs_commit }}"
              SUSFS_COMMIT=$(git rev-parse --short HEAD)
              echo "SUSFS_COMMIT=${SUSFS_COMMIT}" >> $GITHUB_ENV
              SUSFS_COMMIT_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/${SUSFS_COMMIT}"
              echo "SUSFS_COMMIT_URL=${SUSFS_COMMIT_URL}" >> $GITHUB_ENV
              echo "==> SUSFS: using custom commit ${SUSFS_COMMIT} on branch gki-android12-5.10 (${SUSFS_COMMIT_URL})"
            else
              git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
              cd susfs
              SUSFS_COMMIT=$(git rev-parse --short HEAD)
              echo "SUSFS_COMMIT=${SUSFS_COMMIT}" >> $GITHUB_ENV
              SUSFS_COMMIT_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/${SUSFS_COMMIT}"
              echo "SUSFS_COMMIT_URL=${SUSFS_COMMIT_URL}" >> $GITHUB_ENV
              echo "==> SUSFS: using latest commit ${SUSFS_COMMIT} on branch gki-android12-5.10 (${SUSFS_COMMIT_URL})"
            fi
            cp ./kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ..
            cp ./kernel_patches/fs/* ../fs/
            cp ./kernel_patches/include/linux/* ../include/linux/

            SUSFS_VERSION_TAG=$(sed -n 's/.*SUSFS_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' kernel_patches/include/linux/susfs.h | head -n1)
            echo "SUSFS_VERSION_TAG=${SUSFS_VERSION_TAG:-unknown}" >> $GITHUB_ENV
            echo "==> SUSFS: detected version ${SUSFS_VERSION_TAG:-unknown} from susfs.h"

            cd ..
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/marble_defconfig
          fi

          if [[ "${{ env.NOMOUNT }}" == true ]]; then
            echo "::group::NoMount integration"

            if [[ -n "${{ inputs.nomount_commit }}" ]]; then
              echo "==> NoMount: using custom commit/tag ${{ inputs.nomount_commit }}"
              curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s "${{ inputs.nomount_commit }}"
            else
              echo "==> NoMount: using latest commit on master"
              curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s master
            fi

            if [[ -d "NoMount/.git" ]]; then
              NOMOUNT_COMMIT=$(cd NoMount && git rev-parse --short HEAD 2>/dev/null || echo "")
              NOMOUNT_REPO_URL=$(cd NoMount && git remote get-url origin 2>/dev/null | sed 's/\.git$//')
              NOMOUNT_COMMIT_URL="${NOMOUNT_REPO_URL}/commit/${NOMOUNT_COMMIT}"
              echo "NOMOUNT_COMMIT=${NOMOUNT_COMMIT}" >> $GITHUB_ENV
              echo "NOMOUNT_COMMIT_URL=${NOMOUNT_COMMIT_URL}" >> $GITHUB_ENV
              echo "==> NoMount: using commit ${NOMOUNT_COMMIT} (${NOMOUNT_COMMIT_URL})"

              NOMOUNT_VERSION_TAG=$(sed -n 's/^version=\(.*\)$/\1/p' NoMount/module/module.prop 2>/dev/null | head -n1)
              echo "NOMOUNT_VERSION_TAG=${NOMOUNT_VERSION_TAG:-unknown}" >> $GITHUB_ENV
              echo "==> NoMount: detected version ${NOMOUNT_VERSION_TAG:-unknown} from module.prop"
            else
              echo "::warning::Could not find NoMount/.git after setup.sh ran - NoMount commit will show as unknown in the release notes."
              echo "NOMOUNT_COMMIT=" >> $GITHUB_ENV
              echo "NOMOUNT_COMMIT_URL=" >> $GITHUB_ENV
              echo "NOMOUNT_VERSION_TAG=" >> $GITHUB_ENV
            fi

            echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/marble_defconfig
            echo "::endgroup::"
          fi

          if [[ "${{ env.BBG }}" == true ]]; then
            wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
            echo "CONFIG_BBG=y" >> arch/arm64/configs/marble_defconfig
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

          if [[ "${{ env.REKERNEL_NETLINK }}" == true ]]; then
            git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git rekernel-src
            bash rekernel-src/Integrate/patches.sh
            echo "CONFIG_REKERNEL=y" >> arch/arm64/configs/marble_defconfig
            echo "CONFIG_REKERNEL_NETWORK=y" >> arch/arm64/configs/marble_defconfig
          fi

          if [[ "${{ env.REKERNEL_EBPF }}" == true ]]; then
            echo "==> Re-Kernel eBPF selected; will build after the kernel Image is ready."
          fi

          if [[ "${{ env.DROIDSPACES }}" == true ]]; then
            echo "::group::DroidSpaces integration"
            apply_droidspaces_patch() {
              local patch_file="$1" label="$2"
              if patch -p1 -N --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                patch -p1 -N --fuzz=0 < "$patch_file"
                echo "==> DroidSpaces ${label}: applied."
                return 0
              elif patch -p1 -R --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                echo "==> DroidSpaces ${label}: already present natively on this branch (confirmed via reverse-check) - not re-applying."
                return 0
              else
                echo "::warning::DroidSpaces ${label} doesn't apply cleanly in either direction - can't confirm the kABI fix is actually present on this tree."
                return 1
              fi
            }

            DROIDSPACES_SAFE=true

            curl -sLo patch-for-below-6.12.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            apply_droidspaces_patch patch-for-below-6.12.patch "patch 001 (sysvipc kabi fix)" || DROIDSPACES_SAFE=false

            curl -sLo patch-for-5.10-or-lower.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
            apply_droidspaces_patch patch-for-5.10-or-lower.patch "patch 002 (posix_mqueue abi padding)" || DROIDSPACES_SAFE=false

            if [[ "$DROIDSPACES_SAFE" == true ]]; then
              if [[ -f "${GITHUB_WORKSPACE}/configs/droidspaces-gki.config" ]]; then
                cat "${GITHUB_WORKSPACE}/configs/droidspaces-gki.config" >> arch/arm64/configs/marble_defconfig
                echo "==> DroidSpaces: config fragment appended to marble_defconfig."
              else
                echo "::warning::configs/droidspaces-gki.config not found in this repo's root - DroidSpaces config fragment not applied (nothing to enable it with). Add that file to the repo (see ravindu644/Droidspaces-OSS 'Configuring GKI Kernels' docs) to actually turn DroidSpaces on."
              fi
            else
              echo "::warning::Skipping the DroidSpaces config fragment entirely this run - at least one required kABI patch could not be confirmed. Enabling CONFIG_SYSVIPC/CONFIG_IPC_NS/CONFIG_POSIX_MQUEUE without it risks a bootloop per DroidSpaces-OSS's own docs, so this run won't have working DroidSpaces support."
            fi
            echo "::endgroup::"
          fi

          echo "-${KERNEL_NAME}-${{ github.actor }}" > .scmversion

          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/marble_defconfig

          echo "CONFIG_BPF_SYSCALL=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_BPF_JIT=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_CGROUP_BPF=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_BPF_EVENTS=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_UPROBE_EVENTS=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_NET_CLS_ACT=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_NET_CLS_BPF=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_NET_ACT_BPF=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_NET_SCH_INGRESS=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_DEBUG_INFO=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/marble_defconfig
          echo "CONFIG_DEBUG_INFO_BTF_MODULES=y" >> arch/arm64/configs/marble_defconfig

          make O=out marble_defconfig

          make -j$(nproc) O=out CC="ccache ${CLANG_ROOT}/clang" HOSTCC="ccache ${CLANG_ROOT}/clang" Image

          echo "ccache status after build:"
          ccache -s

      - name: Save ccache
        if: ${{ always() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}-${{ matrix.ksu_type }}

      - name: Build Re-Kernel (eBPF)
        if: ${{ env.REKERNEL_EBPF == 'true' }}
        run: |
          set -e

          curl -sSL -o bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          mkdir -p bpftool-bin
          tar -xzf bpftool.tar.gz -C bpftool-bin
          chmod +x bpftool-bin/bpftool

          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          rm -f android-ndk-r27d-linux.zip

          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/Sakion-Team/Re-Kernel.git rekernel-ebpf-src
          cd rekernel-ebpf-src
          git sparse-checkout set eBPF-Source
          cd eBPF-Source

          "${GITHUB_WORKSPACE}/bpftool-bin/bpftool" btf dump file \
            "${GITHUB_WORKSPACE}/${SOC}/out/vmlinux" format c > include/vmlinux.h

          NDK_PATH="${GITHUB_WORKSPACE}/android-ndk-r27d"

          if ! make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}"; then
            echo "::warning::Re-Kernel eBPF build failed with plain vmlinux.h — retrying with EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES (binder structs may be missing from our BTF dump)."
            make clean
            make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}" EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES
          fi

          cp out/rekernel.bpf.o "${GITHUB_WORKSPACE}/rekernel.bpf.o"
          cp out/rekerneld_aarch64 "${GITHUB_WORKSPACE}/rekerneld_aarch64"

      - name: Make AnyKernel3
        run: |
          if [[ "${{ matrix.ksu_type }}" == "Vanilla" ]]; then
            # Vanilla is built once with every feature, so no FULL/CORE tag in the name
            ZIP_NAME="${KERNEL_NAME}-Vanilla"
          else
            ZIP_NAME="${KERNEL_NAME}-${{ matrix.ksu_type }}-${{ matrix.build_mode }}"
          fi

          if [[ "${{ env.SUSFS }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}-SuSFS"
          fi

          if [[ "${{ env.NOMOUNT }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}-NoMount"
          fi

          ZIP_NAME="${ZIP_NAME}-${KERNEL_BASE_VERSION}"

          git clone --depth=1 -b Anykernel3 https://github.com/yudharn/AnyKernel3 AnyKernel3

          (cd ${SOC}/out/arch/arm64/boot && 7z a "${GITHUB_WORKSPACE}/AnyKernel3/Image.7z" Image)
          cp ${SOC}/out/arch/arm64/boot/Image ./Image

          IMAGE_SHA1=$(sha1sum ${SOC}/out/arch/arm64/boot/Image | awk '{print $1}')
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" AnyKernel3/anykernel.sh
          cd AnyKernel3

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

          echo "ZIP_NAME=${ZIP_NAME}.zip" >> $GITHUB_ENV

      - name: Fetch ${{ matrix.ksu_type }} manager APK (CI)
        if: ${{ inputs.include_manager_apk && matrix.ksu_type != 'Vanilla' }}
        continue-on-error: true
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -uo pipefail
          KSU_TYPE="${{ matrix.ksu_type }}"
          # "<repo> <branch> <workflow file> <artifact name regex>", tried in order
          case "$KSU_TYPE" in
            "Official-KernelSU") CANDS=("tiann/KernelSU main build-manager.yml ^manager$") ;;
            "KernelSU-Next")
              CANDS=()
              [[ "${SUSFS}" == true ]] && CANDS+=("pershoot/KernelSU-Next dev-susfs build-manager-ci.yml ^manager$")
              CANDS+=("KernelSU-Next/KernelSU-Next dev build-manager-ci.yml ^manager$") ;;
            "BakaSU") CANDS=("Baka-SU/BakaSU sync-susfs build-manager.yml ^Manager-release$" "Baka-SU/BakaSU main build-manager.yml ^Manager-release$") ;;
            *) echo "==> No manager CI known for ${KSU_TYPE}"; exit 0 ;;
          esac

          # github.token first, RELEASE_PAT as fallback (cross-repo artifact access)
          api() { gh api "$@" 2>/dev/null || { [[ -n "${PAT}" ]] && GH_TOKEN="${PAT}" gh api "$@"; }; }
          api_dl() { gh api "$1" > "$2" 2>/dev/null || { [[ -n "${PAT}" ]] && GH_TOKEN="${PAT}" gh api "$1" > "$2"; }; }

          for c in "${CANDS[@]}"; do
            read -r REPO BRANCH WF ART_RE <<<"$c"
            RUN_JSON=""
            MATCH=latest
            if [[ -n "${KSU_MANAGER_SHA:-}" ]]; then
              RUN_JSON=$(api "repos/${REPO}/actions/workflows/${WF}/runs?branch=${BRANCH}&status=success&head_sha=${KSU_MANAGER_SHA}&per_page=1" --jq '.workflow_runs[0] // empty')
              [[ -n "$RUN_JSON" ]] && MATCH=exact
            fi
            if [[ -z "$RUN_JSON" ]]; then
              RUN_JSON=$(api "repos/${REPO}/actions/workflows/${WF}/runs?branch=${BRANCH}&event=push&status=success&per_page=1" --jq '.workflow_runs[0] // empty')
            fi
            if [[ -z "$RUN_JSON" ]]; then
              echo "==> ${REPO}@${BRANCH}: no successful ${WF} run"
              continue
            fi
            RUN_ID=$(jq -r '.id' <<<"$RUN_JSON")
            RUN_SHA=$(jq -r '.head_sha[0:8]' <<<"$RUN_JSON")
            RUN_URL=$(jq -r '.html_url' <<<"$RUN_JSON")

            ART_ID=$(api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired | not) | select(.name | test(\"${ART_RE}\"))][0].id // empty")
            if [[ -z "$ART_ID" ]]; then
              echo "==> ${RUN_URL}: no unexpired artifact matching ${ART_RE}"
              continue
            fi

            rm -rf mgr-dl && mkdir -p mgr-dl
            if ! api_dl "repos/${REPO}/actions/artifacts/${ART_ID}/zip" mgr-dl/artifact.zip; then
              echo "::warning::Artifact download from ${RUN_URL} failed (token cannot read cross-repo artifacts? set RELEASE_PAT)."
              continue
            fi
            unzip -q -o mgr-dl/artifact.zip -d mgr-dl
            APK=$(find mgr-dl -name '*.apk' ! -iname '*spoof*' ! -iname '*debug*' | sort | head -n1)
            [[ -z "$APK" ]] && { echo "==> no APK inside artifact ${ART_ID}"; continue; }

            OUT="${KSU_TYPE}_Manager_$(basename "$APK")"
            cp "$APK" "$OUT"
            {
              echo "MANAGER_APK=${OUT}"
              echo "MANAGER_APK_URL=${RUN_URL}"
              echo "MANAGER_APK_MATCH=${MATCH}"
              echo "MANAGER_APK_SHA=${RUN_SHA}"
            } >> "$GITHUB_ENV"
            echo "==> ${OUT} <- ${REPO}@${RUN_SHA} (${MATCH} match to kernel ${KSU_MANAGER_COMMIT:-?}) ${RUN_URL}"
            exit 0
          done
          echo "::warning::Could not fetch a ${KSU_TYPE} manager APK - this release will not include it."

      - name: Write build metadata
        run: |
          jq -n \
            --arg ksu_type "${{ matrix.ksu_type }}" \
            --arg build_mode "${{ matrix.build_mode }}" \
            --arg kernel_name "${KERNEL_NAME}" \
            --arg zip_name "${ZIP_NAME}" \
            --arg ksu_manager_version "${KSU_MANAGER_VERSION:-unknown}" \
            --arg ksu_manager_commit "${KSU_MANAGER_COMMIT:-}" \
            --arg ksu_manager_commit_url "${KSU_MANAGER_COMMIT_URL:-}" \
            --arg kernel_commit "${KERNEL_COMMIT}" \
            --arg kernel_commit_url "${KERNEL_COMMIT_URL}" \
            --arg kernel_base_version "${KERNEL_BASE_VERSION:-unknown}" \
            --arg clang_version "${CLANG_VERSION}" \
            --arg susfs_commit "${SUSFS_COMMIT:-}" \
            --arg susfs_commit_url "${SUSFS_COMMIT_URL:-}" \
            --arg susfs_version_tag "${SUSFS_VERSION_TAG:-}" \
            --arg nomount_commit "${NOMOUNT_COMMIT:-}" \
            --arg nomount_commit_url "${NOMOUNT_COMMIT_URL:-}" \
            --arg nomount_version_tag "${NOMOUNT_VERSION_TAG:-}" \
            --arg manager_apk "${MANAGER_APK:-}" \
            --arg manager_apk_url "${MANAGER_APK_URL:-}" \
            --arg manager_apk_match "${MANAGER_APK_MATCH:-}" \
            --arg manager_apk_sha "${MANAGER_APK_SHA:-}" \
            '{manager_apk:$manager_apk,manager_apk_url:$manager_apk_url,manager_apk_match:$manager_apk_match,manager_apk_sha:$manager_apk_sha,ksu_type:$ksu_type,build_mode:$build_mode,kernel_name:$kernel_name,zip_name:$zip_name,ksu_manager_version:$ksu_manager_version,ksu_manager_commit:$ksu_manager_commit,ksu_manager_commit_url:$ksu_manager_commit_url,kernel_commit:$kernel_commit,kernel_commit_url:$kernel_commit_url,kernel_base_version:$kernel_base_version,clang_version:$clang_version,susfs_commit:$susfs_commit,susfs_commit_url:$susfs_commit_url,susfs_version_tag:$susfs_version_tag,nomount_commit:$nomount_commit,nomount_commit_url:$nomount_commit_url,nomount_version_tag:$nomount_version_tag}' \
            > "${GITHUB_WORKSPACE}/metadata.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.ksu_type }}-${{ matrix.build_mode }}
          path: |
            ${{ env.ZIP_NAME }}
            metadata.json
            *_Manager_*.apk
          if-no-files-found: ignore
          retention-days: 1

  Create_Release:
    name: Create combined GitHub Release
    needs: [Build_Kernel_Marble]

    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Release target (yudharn/POCOF5-Melt-Rebase-Kernel-Marble) is a different
      # repo than the one this workflow runs in, so the default GITHUB_TOKEN
      # (github.token) can't publish there — it only has permissions scoped to
      # this repo. RELEASE_PAT must be a PAT (classic "repo" scope, or
      # fine-grained with Contents: Read & write) added as a secret on
      # whichever repo hosts this workflow, granting access to the release repo.
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      RELEASE_REPO: yudharn/POCOF5-Melt-Rebase-Kernel-Marble
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: build-*

      - name: Create combined release
        run: |
          set -e
          mkdir -p artifacts
          cd artifacts

          echo "==> Downloaded artifact layout:"
          find . -maxdepth 3 -type f | sort

          ASSETS=()
          NOTES_ROWS=""
          FIRST=true
          FOUND_ANY=false

          declare -A ROW_VERSION
          declare -A ROW_MODES
          declare -A ROW_APK
          ORDERED_TYPES=()

          while IFS= read -r META; do
            FOUND_ANY=true
            dir="$(dirname "$META")/"

            KSU_TYPE=$(jq -r '.ksu_type' "$META")
            BUILD_MODE_LEG=$(jq -r '.build_mode' "$META")
            ZIP_NAME=$(jq -r '.zip_name' "$META")
            KSU_MANAGER_VERSION=$(jq -r '.ksu_manager_version' "$META")
            KSU_MANAGER_COMMIT=$(jq -r '.ksu_manager_commit' "$META")
            KSU_MANAGER_COMMIT_URL=$(jq -r '.ksu_manager_commit_url' "$META")

            if $FIRST; then
              KERNEL_NAME=$(jq -r '.kernel_name' "$META")
              KERNEL_COMMIT=$(jq -r '.kernel_commit' "$META")
              KERNEL_COMMIT_URL=$(jq -r '.kernel_commit_url' "$META")
              KERNEL_BASE_VERSION=$(jq -r '.kernel_base_version' "$META")
              CLANG_VERSION=$(jq -r '.clang_version' "$META")
              NOMOUNT_COMMIT=$(jq -r '.nomount_commit' "$META")
              NOMOUNT_COMMIT_URL=$(jq -r '.nomount_commit_url' "$META")
              NOMOUNT_VERSION_TAG=$(jq -r '.nomount_version_tag' "$META")
              FIRST=false
            fi

            if [[ -z "${SUSFS_COMMIT:-}" && -n "$(jq -r '.susfs_commit' "$META")" ]]; then
              SUSFS_COMMIT=$(jq -r '.susfs_commit' "$META")
              SUSFS_COMMIT_URL=$(jq -r '.susfs_commit_url' "$META")
              SUSFS_VERSION_TAG=$(jq -r '.susfs_version_tag' "$META")
            fi

            ASSETS+=("${dir}${ZIP_NAME}")

            MANAGER_APK=$(jq -r '.manager_apk // ""' "$META")
            if [[ -n "$MANAGER_APK" && -f "${dir}${MANAGER_APK}" && -z "${ROW_APK[$KSU_TYPE]+x}" ]]; then
              ASSETS+=("${dir}${MANAGER_APK}")
              ROW_APK["$KSU_TYPE"]="\`${MANAGER_APK}\` ([CI $(jq -r '.manager_apk_match' "$META")@$(jq -r '.manager_apk_sha' "$META")]($(jq -r '.manager_apk_url' "$META")))"
            fi

            if [[ "$KSU_TYPE" == "Vanilla" ]]; then
              ksu_row_version="—"
            elif [[ -n "$KSU_MANAGER_COMMIT" ]]; then
              ksu_row_version="${KSU_MANAGER_VERSION}@[${KSU_MANAGER_COMMIT}](${KSU_MANAGER_COMMIT_URL})"
            else
              ksu_row_version="${KSU_MANAGER_VERSION}"
            fi

            if [[ -z "${ROW_MODES[$KSU_TYPE]+x}" ]]; then
              ORDERED_TYPES+=("$KSU_TYPE")
              ROW_VERSION["$KSU_TYPE"]="$ksu_row_version"
              ROW_MODES["$KSU_TYPE"]="$BUILD_MODE_LEG"
            else
              ROW_MODES["$KSU_TYPE"]="${ROW_MODES[$KSU_TYPE]},${BUILD_MODE_LEG}"
            fi
          done < <(find . -type f -name 'metadata.json' | sort)

          if [[ "$FOUND_ANY" == false ]]; then
            echo "::warning::No metadata.json found anywhere under artifacts/, skipping"
          fi

          for KSU_TYPE in "${ORDERED_TYPES[@]}"; do
            MODES_RAW="${ROW_MODES[$KSU_TYPE]}"
            if [[ "$MODES_RAW" == *"FULL"* && "$MODES_RAW" == *"CORE"* ]]; then
              MODE_LABEL="FULL&CORE"
            else
              MODE_LABEL="$MODES_RAW"
            fi
            NOTES_ROWS="${NOTES_ROWS}
           | ${KSU_TYPE} | ${MODE_LABEL} | ${ROW_VERSION[$KSU_TYPE]} | ${ROW_APK[$KSU_TYPE]:-—} |"
          done

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "::error::No successful builds found in any matrix leg — skipping release creation."
            exit 1
          fi

          MODES_SELECTED=()
          [[ "${{ inputs.full_build }}" == true ]] && MODES_SELECTED+=("FULL")
          [[ "${{ inputs.core_build }}" == true ]] && MODES_SELECTED+=("CORE")
          [[ "${{ inputs.manager_vanilla }}" == true ]] && MODES_SELECTED+=("VANILLA")
          MODES_LABEL=""
          for m in "${MODES_SELECTED[@]}"; do
            if [[ -z "$MODES_LABEL" ]]; then
              MODES_LABEL="$m"
            else
              MODES_LABEL="${MODES_LABEL} + ${m}"
            fi
          done

          if [[ -z "${SUSFS_COMMIT:-}" ]]; then
            susfs_checkbox="Not included (Vanilla only)"
          elif [[ -n "${SUSFS_VERSION_TAG:-}" && "$SUSFS_VERSION_TAG" != "unknown" && "$SUSFS_VERSION_TAG" != "null" ]]; then
            susfs_checkbox="Supported (susfs4ksu ${SUSFS_VERSION_TAG}@[${SUSFS_COMMIT}](${SUSFS_COMMIT_URL}))"
          else
            susfs_checkbox="Supported (susfs4ksu@[${SUSFS_COMMIT}](${SUSFS_COMMIT_URL}))"
          fi

          rekernel_netlink_checkbox="Supported"
          rekernel_ebpf_checkbox="Supported"

          if [[ -n "$NOMOUNT_COMMIT" ]]; then
            if [[ -n "$NOMOUNT_VERSION_TAG" && "$NOMOUNT_VERSION_TAG" != "unknown" && "$NOMOUNT_VERSION_TAG" != "null" ]]; then
              nomount_checkbox="Supported (nomount ${NOMOUNT_VERSION_TAG}@[${NOMOUNT_COMMIT}](${NOMOUNT_COMMIT_URL}))"
            else
              nomount_checkbox="Supported (nomount@[${NOMOUNT_COMMIT}](${NOMOUNT_COMMIT_URL}))"
            fi
          else
            nomount_checkbox="Supported"
          fi

          BUILD_TIME=$(date -u +"%Y%m%d_%H%M")
          REL_NAME="${KERNEL_BASE_VERSION}-${KERNEL_NAME}-${BUILD_TIME}"

          gh release create "$REL_NAME" -R "${RELEASE_REPO}" --title "$REL_NAME" --notes "# Kernel Melt Rebase for POCO F5 (marble)

           | | |
           |:---|:---|
           | 📱 Device | POCO F5 (marble) • Redmi Note 12 Turbo (marble) |
           | 🟠 ROM Support | HyperOS,ColorOS,OxygenOS |
           | 🧰 Kernel Name | ${KERNEL_NAME}
           | 🔧 Kernel Base | ${KERNEL_BASE_VERSION} |
           | 🛠️ Build Scope | ZIP |
           | 🧬 Build Modes in this run | ${MODES_LABEL} |
           | 📦 Source | ${{ inputs.kernel_source }} |
           | 🔗 Kernel branch | ${{ inputs.kernel_branch }}@[${KERNEL_COMMIT}](${KERNEL_COMMIT_URL})
           | ⚙️ SuSFS Version | ${susfs_checkbox}
           | 🛡️ Baseband Guard | Supported (Full & Vanilla only) |
           | 🖥️ Droidspaces | Supported (Full & Vanilla only) |
           | ⚙️ Re-Kernel (Netlink) | ${rekernel_netlink_checkbox}
           | ⚙️ Re-Kernel (eBPF) | ${rekernel_ebpf_checkbox}
           | 🗂️ NoMount | ${nomount_checkbox}
           | 🧩 eBPF | Enabled (BTF/CO-RE, kprobe+uprobe, cgroup+tc hooks) |
           | 🔨 Compiler | ${CLANG_VERSION} |

           ---

           ### 🧬 Full vs Core vs Vanilla

           NoMount and Re-Kernel (Netlink+eBPF) are enabled in all zip packages in this release. SuSFS is enabled in every KernelSU zip. BBG and DroidSpaces are only available in the FULL and VANILLA builds — check the 'Mode' column in the manager table below to see which zip is FULL, CORE or VANILLA.
           
           | Mode | SuSFS | NoMount | BBG | Re-Kernel Netlink | Re-Kernel eBPF | DroidSpaces |
           |:---|:---:|:---:|:---:|:---:|:---:|:---:|
           | **FULL** | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |
           | **CORE** | ✅ | ✅ | ❌ | ✅ | ✅ | ❌ |
           | **VANILLA** | ❌ | ✅ | ✅ | ✅ | ✅ | ✅ |

           > **Vanilla**: no KernelSU manager and no SuSFS built in. Every other feature is on. Built once per run (ignores Full/Core).

           ---

           ### 💻 KSU Managers in this build

           | Manager | Mode | Version | Manager APK |
           |:---|:---:|:---|:---|${NOTES_ROWS}

           ---
          " "${ASSETS[@]}"
          
