name: Morphe YouTube + YouTube Music (Root / no MicroG)

# What it does:
#  1. Fetch the latest Morphe CLI + Morphe patches (dev or stable channel)
#  2. For each app: find the newest version SUPPORTED by those patches
#  3. Download the stock APK (APKPure via apkeep, or from apk_url)
#  4. Patch WITHOUT "GmsCore support" -> original package name (no MicroG)
#  5. Upload to GitHub Releases (skipped if this version combo was already built)

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build"
        type: choice
        options: [all, youtube, music]
        default: all
      patches_channel:
        description: "Morphe patches channel"
        type: choice
        options: [dev, stable]
        default: dev
      youtube_version:
        description: "YouTube version (empty = latest supported)"
        type: string
        default: ""
      music_version:
        description: "YouTube Music version (empty = latest supported)"
        type: string
        default: ""
      youtube_apk_url:
        description: "Optional: direct link to a stock YouTube APK"
        type: string
        default: ""
      music_apk_url:
        description: "Optional: direct link to a stock YouTube Music APK (arm64-v8a)"
        type: string
        default: ""
      include_experimental:
        description: "Include experimental versions (the newest one is usually experimental)"
        type: boolean
        default: true
      striplibs:
        description: "Native lib architectures to keep, e.g. arm64-v8a (empty = keep all)"
        type: string
        default: ""
      signature:
        description: "original = keep Google's signature (accounts survive updates), custom = sign with your keystore"
        type: choice
        options: [original, custom]
        default: original
      force_build:
        description: "Rebuild even if a release with the same versions exists"
        type: boolean
        default: false
  schedule:
    # Every day at 19:17 UTC
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: morphe-root
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.patches_channel || 'dev' }}
  INCLUDE_EXPERIMENTAL: ${{ github.event_name == 'schedule' || inputs.include_experimental }}
  STRIPLIBS: ${{ inputs.striplibs || '' }}
  FORCE_BUILD: ${{ github.event_name != 'schedule' && inputs.force_build }}
  SIGNATURE: ${{ inputs.signature || 'original' }}
  GH_TOKEN: ${{ github.token }}
  # Releases are published here (needs the MORPHE_PAT secret, see README)
  RELEASE_REPO: yudharn/YouTube-Morphe
  # Name of the Morphe entry in the app settings
  SETTINGS_TITLE: "Morphe (Patch By Yudharn)"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cli_tag: ${{ steps.plan.outputs.cli_tag }}
      patch_tag: ${{ steps.plan.outputs.patch_tag }}
    steps:
      - name: Check access to the release repo
        env:
          GH_TOKEN: ${{ secrets.MORPHE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MORPHE_PAT secret is missing. Add a token with Contents read/write access to $RELEASE_REPO."
            exit 1
          fi
          PERM=$(gh api "repos/$RELEASE_REPO" --jq '.permissions.push' 2>/dev/null || echo false)
          if [ "$PERM" != "true" ]; then
            echo "::error::MORPHE_PAT cannot push to $RELEASE_REPO. Check the token's repository access and Contents permission."
            exit 1
          fi
          echo "Releases will be published to $RELEASE_REPO"

      - name: Resolve Morphe versions & app list
        id: plan
        env:
          APPS: ${{ inputs.apps || 'all' }}
        run: |
          set -euo pipefail
          # dev = newest release (pre-releases included), stable = the "latest" release
          pick_tag() {
            if [ "$CHANNEL" = "dev" ]; then
              gh api "repos/$1/releases?per_page=30" --jq '[.[] | select(.draft | not)][0].tag_name'
            else
              gh api "repos/$1/releases/latest" --jq '.tag_name'
            fi
          }
          CLI_TAG=$(pick_tag MorpheApp/morphe-desktop)
          PATCH_TAG=$(pick_tag MorpheApp/morphe-patches)
          echo "Morphe CLI : $CLI_TAG"
          echo "Patches    : $PATCH_TAG"

          # Where to look for each stock APK; certs = Google's signing certificates (SHA-256) from the Morphe patches.
          # variant "all" = universal APK. YouTube Music has no universal APK signed by Google, only per-arch ones.
          YT=$(jq -nc '{
            id: "youtube", app: "YouTube", pkg: "com.google.android.youtube",
            variant: "all", libs: "arm64-v8a,armeabi-v7a", arch: "arm64-v8a;armeabi-v7a;x86;x86_64",
            apkmirror: "https://www.apkmirror.com/apk/google-inc/youtube",
            uptodown: "https://youtube.en.uptodown.com/android",
            archive: "https://archive.org/download/jhc-apks/apks/com.google.android.youtube",
            certs: "5aad2bee6db95d17e05a08d7d1e64c10a1511879154483916b6ae6c7fd9cb0c6,3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a"
          }')
          YTM=$(jq -nc '{
            id: "music", app: "YouTube Music", pkg: "com.google.android.apps.youtube.music",
            variant: "arm64-v8a", libs: "arm64-v8a", arch: "arm64-v8a",
            apkmirror: "https://www.apkmirror.com/apk/google-inc/youtube-music",
            uptodown: "https://youtube-music.en.uptodown.com/android",
            archive: "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music",
            certs: "6a2f65ec694a6a632acdcb5080912a565f903d4b8d83f0eb8e44fbdf2660d8e1,a2a1ad7ba7f41dfca4514e2afeb90691719af6d0fdbed4b09bbf0ed897701ceb"
          }')
          case "$APPS" in
            youtube) M="[$YT]" ;;
            music)   M="[$YTM]" ;;
            *)       M="[$YT,$YTM]" ;;
          esac

          {
            echo "cli_tag=$CLI_TAG"
            echo "patch_tag=$PATCH_TAG"
            echo "matrix={\"include\":$M}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.app }}
    env:
      APP: ${{ matrix.app }}
      PKG: ${{ matrix.pkg }}
      TAG_PREFIX: ${{ matrix.id }}
      APK_ARCH: ${{ matrix.arch }}
      VARIANT: ${{ matrix.variant }}
      APP_LIBS: ${{ matrix.libs }}
      APKMIRROR_URL: ${{ matrix.apkmirror }}
      UPTODOWN_URL: ${{ matrix.uptodown }}
      ARCHIVE_URL: ${{ matrix.archive }}
      GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
      GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
      OFFICIAL_CERTS: ${{ matrix.certs }}
      CLI_TAG: ${{ needs.plan.outputs.cli_tag }}
      PATCH_TAG: ${{ needs.plan.outputs.patch_tag }}
      APP_VERSION: ${{ matrix.id == 'youtube' && inputs.youtube_version || matrix.id == 'music' && inputs.music_version || '' }}
      APK_URL: ${{ matrix.id == 'youtube' && inputs.youtube_apk_url || matrix.id == 'music' && inputs.music_apk_url || '' }}
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Morphe CLI, patches & apkeep
        run: |
          set -euo pipefail
          mkdir -p bins
          export MORPHE_DATA_DIR="$RUNNER_TEMP/morphe-data"; mkdir -p "$MORPHE_DATA_DIR"
          echo "MORPHE_DATA_DIR=$MORPHE_DATA_DIR" >> "$GITHUB_ENV"

          gh release download "$CLI_TAG" -R MorpheApp/morphe-desktop -p '*-all.jar' -O bins/morphe.jar --clobber
          gh release download "$PATCH_TAG" -R MorpheApp/morphe-patches -p '*.mpp' -O bins/patches.mpp --clobber
          gh release download -R EFForg/apkeep -p 'apkeep-x86_64-unknown-linux-gnu' -O bins/apkeep --clobber
          chmod +x bins/apkeep
          java -jar bins/morphe.jar --version || true

      - name: Write helper scripts
        run: |
          cat > bins/keep_original_signature.py <<'PY'
          #!/usr/bin/env python3
          """Copy the APK Signing Block (v2/v3) from a stock APK into a patched, unsigned APK.

          usage: keep_original_signature.py <stock.apk|.apkm|.xapk|.apks> <patched-unsigned.apk> <out.apk>
          """
          import io
          import struct
          import sys
          import zipfile

          MAGIC = b"APK Sig Block 42"


          def locate(d):
              eocd = d.rfind(b"PK\x05\x06", max(0, len(d) - 65557))
              if eocd < 0:
                  sys.exit("not a zip file")
              cd = struct.unpack_from("<I", d, eocd + 16)[0]
              z64 = None
              if cd == 0xFFFFFFFF:
                  loc = d.rfind(b"PK\x06\x07", 0, eocd)
                  z64 = struct.unpack_from("<Q", d, loc + 8)[0]
                  cd = struct.unpack_from("<Q", d, z64 + 48)[0]
              start = cd
              if d[cd - 16:cd] == MAGIC:
                  size = struct.unpack_from("<Q", d, cd - 24)[0]
                  start = cd - size - 8
              return start, cd, eocd, z64


          def base_apk(path):
              d = open(path, "rb").read()
              if path.endswith(".apk"):
                  return d
              with zipfile.ZipFile(io.BytesIO(d)) as z:
                  apks = [i for i in z.infolist() if i.filename.endswith(".apk")]
                  base = [i for i in apks if i.filename.split("/")[-1] == "base.apk"]
                  main = base[0] if base else max(apks, key=lambda i: i.file_size)
                  return z.read(main)


          def main():
              stock, patched, out = sys.argv[1:4]
              s = base_apk(stock)
              s_start, s_cd, _, _ = locate(s)
              if s_start == s_cd:
                  sys.exit("stock APK has no v2/v3 signing block")
              block = s[s_start:s_cd]

              p = open(patched, "rb").read()
              p_start, p_cd, _, _ = locate(p)
              p = p[:p_start] + p[p_cd:]          # drop an existing block, if any
              _, cd, eocd, z64 = locate(p)

              new = bytearray(p[:cd] + block + p[cd:])
              shift = len(block)
              new_cd = cd + shift
              struct.pack_into("<I", new, eocd + shift + 16, min(new_cd, 0xFFFFFFFF))
              if z64 is not None:
                  struct.pack_into("<Q", new, z64 + shift + 48, new_cd)
                  loc = bytes(new).rfind(b"PK\x06\x07", 0, eocd + shift)
                  struct.pack_into("<Q", new, loc + 8, z64 + shift)

              open(out, "wb").write(new)
              print(f"signing block copied ({len(block)} bytes) -> {out}")


          if __name__ == "__main__":
              main()
          PY

          cat > bins/set_settings_title.py <<'PY'
          #!/usr/bin/env python3
          """Change the Morphe settings entry name inside a patches .mpp bundle.

          usage: set_settings_title.py <patches.mpp> "<new title>"
          """
          import html
          import os
          import re
          import sys
          import zipfile

          ENTRY = "addresources/values/shared/strings.xml"
          PATTERN = re.compile(r'(<string name="morphe_settings_title"[^>]*>)[^<]*(</string>)')


          def main():
              mpp, title = sys.argv[1], sys.argv[2]
              tmp = mpp + ".tmp"
              found = False
              with zipfile.ZipFile(mpp) as src, zipfile.ZipFile(tmp, "w") as dst:
                  for info in src.infolist():
                      data = src.read(info)
                      if info.filename == ENTRY:
                          text, n = PATTERN.subn(lambda m: m.group(1) + html.escape(title, quote=False) + m.group(2),
                                                 data.decode("utf-8"))
                          found = n == 1
                          data = text.encode("utf-8")
                      dst.writestr(info, data, compress_type=info.compress_type)
              if not found:
                  os.remove(tmp)
                  sys.exit(f"morphe_settings_title not found in {ENTRY}, the patches layout changed")
              os.replace(tmp, mpp)
              print(f"settings title set to: {title}")


          if __name__ == "__main__":
              main()
          PY

          python3 -I bins/set_settings_title.py bins/patches.mpp "$SETTINGS_TITLE"

          cat > bins/fetch_apk.py <<'PY'
          #!/usr/bin/env python3
          """Download a stock APK from APKMirror, Uptodown or archive.org.

          usage: fetch_apk.py apkmirror <app page url> <version> <arch> <out file without extension>
                 fetch_apk.py uptodown  <app url ending in /android> <version> <arch> <out file without extension>
                 fetch_apk.py archive   <archive.org folder url> <version> <arch> <out file without extension>

          Prints the saved path on success. Exit code 1 when the version or a matching variant isn't found.
          Variant choice follows j-hc/revanced-magisk-module.
          """
          import http.cookiejar
          import json
          import re
          import sys
          import urllib.parse
          import urllib.request

          from bs4 import BeautifulSoup

          UA = "Mozilla/5.0 (X11; Linux x86_64; rv:108.0) Gecko/20100101 Firefox/108.0"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))


          def get(url, binary=False):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
              with opener.open(req, timeout=60) as r:
                  data = r.read()
              return data if binary else data.decode("utf-8", "replace")


          def soup(url):
              return BeautifulSoup(get(url), "html.parser")


          def save(url, path):
              data = get(url, binary=True)
              if data[:2] != b"PK":
                  raise RuntimeError(f"not a zip file (got {len(data)} bytes, probably a block page)")
              with open(path, "wb") as f:
                  f.write(data)
              return path


          def fail(msg):
              print(msg, file=sys.stderr)
              sys.exit(1)


          def apkmirror(page, version, arch, out):
              page = page.rstrip("/")
              slug = page.rsplit("/", 1)[-1]
              release = f"{page}/{slug}-{version.replace('.', '-')}-release/"
              try:
                  s = soup(release)
              except Exception as e:
                  fail(f"apkmirror: release page not found ({e})")

              # arch "all" = universal only; otherwise universal or that single arch
              ok_arch = ["universal", "noarch", "arm64-v8a + armeabi-v7a"] + ([] if arch == "all" else [arch])
              ok_dpi = {"nodpi", "anydpi"}
              pick, rank = None, len(ok_arch)
              for row in s.select("div.table-row.headerFont"):
                  link = row.select_one("a.accent_color[href]") or row.select_one("a[href]")
                  if not link or "-download" not in link["href"]:
                      continue
                  tokens = [t.strip() for t in row.get_text("\n").split("\n") if t.strip()]
                  kind = "BUNDLE" if "BUNDLE" in tokens else ("APK" if "APK" in tokens else None)
                  row_arch = next((t for t in tokens if t in ok_arch or "arm" in t or "x86" in t or t in ("universal", "noarch")), "")
                  dpi = next((t for t in tokens if "dpi" in t), "")
                  # Full APK only: a bundle would have to be merged and re-signed, losing Google's signature
                  if kind == "APK" and row_arch in ok_arch and dpi in ok_dpi and ok_arch.index(row_arch) < rank:
                      pick = urllib.parse.urljoin("https://www.apkmirror.com", link["href"])
                      rank = ok_arch.index(row_arch)
              if not pick:
                  fail("apkmirror: no full APK variant for this arch")

              s = soup(pick)
              btn = s.select_one("a.downloadButton[href]") or s.select_one("a.btn[href]")
              if not btn:
                  fail("apkmirror: download button not found")
              s = soup(urllib.parse.urljoin("https://www.apkmirror.com", btn["href"]))
              final = s.select_one('a[rel="nofollow"][href*="download.php"]') or s.select_one('span > a[rel="nofollow"][href]')
              if not final:
                  fail("apkmirror: final download link not found")
              print(save(urllib.parse.urljoin("https://www.apkmirror.com", final["href"]), out + ".apk"))


          def uptodown(base, version, arch, out):
              base = base.rstrip("/")
              host = base.rsplit("/", 1)[0]
              s = soup(base + "/versions")
              node = s.select_one("#detail-app-name[data-code]")
              if not node:
                  fail("uptodown: app code not found")
              code = node["data-code"]

              page = None
              is_bundle = False
              for i in range(1, 21):
                  try:
                      data = json.loads(get(f"{base}/apps/{code}/versions/{i}")).get("data") or []
                  except Exception:
                      break
                  if not data:
                      break
                  hit = next((d for d in data if d.get("version") == version), None)
                  if hit:
                      is_bundle = hit.get("kindFile") == "xapk"
                      v = hit.get("versionURL")
                      page = v if isinstance(v, str) else f"{v['url']}/{v['extraURL']}/{v['versionID']}"
                      break
              if not page:
                  fail("uptodown: version not listed")

              s = soup(page)
              variants = s.select_one(".button.variants[data-version]")
              if variants:
                  ok_arch = ["arm64-v8a, armeabi-v7a, x86, x86_64", "arm64-v8a, armeabi-v7a, x86_64",
                             "arm64-v8a, armeabi-v7a"] + ([] if arch == "all" else [arch])
                  content = json.loads(get(f"{host}/app/{code}/version/{variants['data-version']}/files"))["content"]
                  files = BeautifulSoup(content, "html.parser")
                  root = files.select_one(".content") or files
                  cur_arch, file_id = "", None
                  for child in root.find_all(recursive=False):
                      if "variant" not in (child.get("class") or []):
                          cur_arch = " ".join(child.get_text(" ").split())
                          continue
                      if cur_arch not in ok_arch:
                          continue
                      ftype = child.select_one(".v-file > span")
                      report = child.select_one(".v-report[data-file-id]")
                      if report:
                          is_bundle = bool(ftype and ftype.get_text(strip=True) == "xapk")
                          file_id = report["data-file-id"]
                          break
                  if not file_id:
                      fail("uptodown: no variant for this arch")
                  s = soup(f"{base}/download/{file_id}-x")

              btn = s.select_one("#detail-download-button[data-url]")
              if not btn:
                  fail("uptodown: download button not found")
              print(save(f"https://dw.uptodown.com/dwn/{btn['data-url']}", out + (".xapk" if is_bundle else ".apk")))


          def archive(folder, version, arch, out):
              folder = folder.rstrip("/")
              hrefs = re.findall(r'<a href="([^"?]+)"', get(folder + "/"))
              for tag in ((f"-{version}-all.",) if arch == "all" else (f"-{version}-{arch}.", f"-{version}-all.")):
                  hit = next((h for h in hrefs if tag in urllib.parse.unquote(h) and h.endswith((".apk", ".apkm"))), None)
                  if hit:
                      ext = ".apkm" if hit.endswith(".apkm") else ".apk"
                      print(save(urllib.parse.urljoin(folder + "/", hit), out + ext))
                      return
              fail("archive: version not in the folder")


          if __name__ == "__main__":
              src, url, version, arch, out = sys.argv[1:6]
              try:
                  {"apkmirror": apkmirror, "uptodown": uptodown, "archive": archive}[src](url, version, arch, out)
              except SystemExit:
                  raise
              except Exception as e:
                  fail(f"{src}: {e}")
          PY

          cat > bins/base_apk.py <<'PY'
          #!/usr/bin/env python3
          """Write the base APK of an APK or bundle (apkm/xapk/apks) to <out>.

          usage: base_apk.py <apk|apkm|xapk|apks> <out.apk>
          """
          import io
          import sys
          import zipfile

          src, out = sys.argv[1], sys.argv[2]
          d = open(src, "rb").read()
          with zipfile.ZipFile(io.BytesIO(d)) as z:
              if "AndroidManifest.xml" not in z.namelist():
                  apks = [i for i in z.infolist() if i.filename.endswith(".apk")]
                  base = [i for i in apks if i.filename.split("/")[-1] == "base.apk"]
                  d = z.read(base[0] if base else max(apks, key=lambda i: i.file_size))
          open(out, "wb").write(d)
          PY

          cat > bins/verify_sig.py <<'PY'
          #!/usr/bin/env python3
          """Check that a stock APK (or the base APK inside a bundle) is signed with an expected certificate.

          usage: verify_sig.py <apk|apkm|xapk|apks> <sha256>[,<sha256>...]
          """
          import hashlib
          import io
          import struct
          import sys
          import zipfile

          BLOCK_IDS = (0x7109871A, 0xF05368C0, 0x1B93AD61)  # v2, v3, v3.1


          def base_apk(path):
              d = open(path, "rb").read()
              with zipfile.ZipFile(io.BytesIO(d)) as z:
                  if "AndroidManifest.xml" in z.namelist():
                      return d
                  apks = [i for i in z.infolist() if i.filename.endswith(".apk")]
                  base = [i for i in apks if i.filename.split("/")[-1] == "base.apk"]
                  main = base[0] if base else max(apks, key=lambda i: i.file_size)
                  return z.read(main)


          def lp(b, o):
              n = struct.unpack_from("<I", b, o)[0]
              return b[o + 4:o + 4 + n], o + 4 + n


          def certs(d):
              eocd = d.rfind(b"PK\x05\x06")
              cd = struct.unpack_from("<I", d, eocd + 16)[0]
              if d[cd - 16:cd] != b"APK Sig Block 42":
                  return set()
              size = struct.unpack_from("<Q", d, cd - 24)[0]
              blk = d[cd - size - 8:cd]
              found, p = set(), 8
              while p < len(blk) - 24:
                  n, i = struct.unpack_from("<QI", blk, p)
                  if i in BLOCK_IDS:
                      val = blk[p + 12:p + 8 + n]
                      signers, _ = lp(val, 0)
                      o = 0
                      while o < len(signers):
                          signer, o = lp(signers, o)
                          sd, _ = lp(signer, 0)
                          _, q = lp(sd, 0)            # digests
                          cl, _ = lp(sd, q)           # certificates
                          c = 0
                          while c < len(cl):
                              cert, c = lp(cl, c)
                              found.add(hashlib.sha256(cert).hexdigest())
                  p += 8 + n
              return found


          if __name__ == "__main__":
              path, wanted = sys.argv[1], set(sys.argv[2].lower().split(","))
              try:
                  got = certs(base_apk(path))
              except Exception as e:
                  print(f"{path}: cannot read signature ({e})")
                  sys.exit(1)
              ok = bool(got & wanted)
              print(f"{path}: signature {'OK (official)' if ok else 'NOT official'}; certs: {', '.join(sorted(g[:16] for g in got)) or 'none'}")
              sys.exit(0 if ok else 1)
          PY

          sudo python3 -m pip install --quiet --break-system-packages beautifulsoup4

          cat > bins/has_arch.py <<'PY'
          import collections, io, sys, zipfile
          # has_arch.py <apk|apkm|xapk|apks> <arch>[,<arch>...] : exit 0 only if native libs for every listed arch are present
          path, want = sys.argv[1], sys.argv[2].split(",")
          abis = collections.Counter()
          per = collections.Counter()
          def scan(z, where):
              for n in z.namelist():
                  if n.startswith("lib/") and n.endswith(".so"):
                      abi = n.split("/")[1]
                      abis[f"{where}:{abi}"] += 1
                      per[abi] += 1
          with zipfile.ZipFile(path) as z:
              scan(z, "base")
              for n in z.namelist():
                  if n.endswith(".apk"):
                      try:
                          scan(zipfile.ZipFile(io.BytesIO(z.read(n))), n)
                      except Exception as e:
                          print(f"  cannot read {n}: {e}")
          missing = [a for a in want if not per[a]]
          if missing:
              print("  entries:", ", ".join(n for n in zipfile.ZipFile(path).namelist() if "/" not in n)[:600])
          print(f"{path}: libs per arch {dict(per) or 'none'}; missing: {', '.join(missing) or 'none'}; seen: {dict(abis) or 'none'}")
          sys.exit(1 if missing else 0)
          PY

      - name: Find supported ${{ matrix.app }} versions
        run: |
          set -euo pipefail
          if [ -n "$APP_VERSION" ]; then
            echo "$APP_VERSION" > candidates.txt
          else
            X=""; if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then X="-x"; fi
            java -jar bins/morphe.jar list-versions --patches bins/patches.mpp -f "$PKG" $X 2>&1 | tee versions.txt
            # Grab every version string (e.g. 21.46.522 / 9.46.51), newest first
            # Only the newest supported version: no falling back to older ones
            grep -oE '\b[0-9]{1,2}\.[0-9]{2}\.[0-9]{2,3}\b' versions.txt | sort -uVr | head -n 1 > candidates.txt
          fi
          [ -s candidates.txt ] || { echo "::error::No supported $APP versions found"; exit 1; }
          echo "Target version: $(cat candidates.txt)"

      - name: Download stock ${{ matrix.app }} APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p apk
          # Native libs that must be present: the striplibs list if set, else the app's own list
          REQ_ARCH="${STRIPLIBS:-$APP_LIBS}"; REQ_ARCH="${REQ_ARCH// /}"
          echo "REQ_ARCH=$REQ_ARCH" >> "$GITHUB_ENV"
          GOT=""; VER=""

          AAPT2=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n1 || true)

          # check <file> <source> <version>: full zip, right version, REQ_ARCH libs and (signature=original) Google's signature
          check() {
            unzip -tq "$1" >/dev/null 2>&1 || { echo "::warning::$2: $1 is not a valid archive"; return 1; }
            if [ -n "$AAPT2" ]; then
              python3 -I bins/base_apk.py "$1" "$RUNNER_TEMP/base.apk"
              local got; got=$("$AAPT2" dump badging "$RUNNER_TEMP/base.apk" 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
              [ "$got" = "$3" ] || { echo "::warning::$2: $1 is version '$got', not $3, skipping it"; return 1; }
            fi
            python3 -I bins/has_arch.py "$1" "$REQ_ARCH" || { echo "::warning::$2: $1 is missing native libs for $REQ_ARCH, skipping it"; return 1; }
            if ! python3 -I bins/verify_sig.py "$1" "$OFFICIAL_CERTS"; then
              if [ "$SIGNATURE" = "original" ]; then
                echo "::warning::$2: $1 is not signed by Google (merged or re-signed), skipping it"; return 1
              fi
              echo "::warning::$2: $1 is not signed by Google, accepted because signature=custom"
            fi
          }

          try_source() { # <source> <version>
            rm -rf apk/*
            case "$1" in
              apkmirror) python3 bins/fetch_apk.py apkmirror "$APKMIRROR_URL" "$2" "$VARIANT" "apk/$PKG@$2" || return 1 ;;
              uptodown)  python3 bins/fetch_apk.py uptodown "$UPTODOWN_URL" "$2" "$VARIANT" "apk/$PKG@$2" || return 1 ;;
              archive)   python3 bins/fetch_apk.py archive "$ARCHIVE_URL" "$2" "$VARIANT" "apk/$PKG@$2" || return 1 ;;
              apkpure)
                ./bins/apkeep -a "$PKG@$2" -d apk-pure -o "acknowledge_dangers=true,arch=$APK_ARCH" apk/ || return 1 ;;
              googleplay)
                # Play only serves its current version; the version check below rejects anything else
                [ -n "${GPLAY_EMAIL:-}" ] && [ -n "${GPLAY_AAS_TOKEN:-}" ] || { echo "no GPLAY_EMAIL/GPLAY_AAS_TOKEN secrets, skipping"; return 1; }
                ./bins/apkeep -a "$PKG" -d google-play -e "$GPLAY_EMAIL" -t "$GPLAY_AAS_TOKEN" \
                  -o "split_apk=true,device=px_9a" apk/ || return 1
                # split download: zip the parts into one .apks bundle
                local d; d=$(find apk -mindepth 1 -maxdepth 1 -type d | head -n1)
                if [ -n "$d" ]; then (cd "$d" && zip -q -0 "../$PKG@play.apks" ./*.apk) && rm -rf "$d"; fi ;;
            esac
            local f; f=$(find apk -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.apkm' -o -name '*.apks' \) | head -n1)
            [ -n "$f" ] && check "$f" "$1" "$2" && GOT="$f"
          }

          if [ -n "$APK_URL" ]; then
            curl -fL --retry 3 -o apk/original.apk "$APK_URL"
            check apk/original.apk apk_url "$(head -n1 candidates.txt)" || { echo "::error::The APK from apk_url can't be used (see the warning above)"; exit 1; }
            GOT=apk/original.apk; VER=$(head -n1 candidates.txt)
            [ -n "$APP_VERSION" ] || echo "::warning::apk_url given without a version, assuming $VER"
          else
            while read -r v; do
              for src in apkmirror uptodown archive apkpure googleplay; do
                echo "== Trying $APP $v from $src =="
                if try_source "$src" "$v"; then VER="$v"; break 2; fi
                echo "Not usable from $src"
              done
            done < candidates.txt
          fi
          [ -n "$GOT" ] || { echo "::error::$APP $(cat candidates.txt) (newest supported) is not available yet on APKMirror, Uptodown, archive.org, APKPure or Google Play. Try again later, or pass a direct link via the apk_url input."; exit 1; }
          ls -la apk
          echo "file=$GOT" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check the latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.MORPHE_PAT }}
        run: |
          set -euo pipefail
          NAME="${APP// /-}-${{ steps.apk.outputs.version }}-Morphe-${PATCH_TAG#v}-ROOT.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p out
          HAVE=$(gh api "repos/$RELEASE_REPO/releases/latest" --jq '.assets[].name' 2>/dev/null || true)
          if [ "$FORCE_BUILD" != "true" ] && grep -qxF "$NAME" <<< "$HAVE"; then
            echo "$NAME is already in the latest release, reusing it instead of rebuilding."
            gh release download -R "$RELEASE_REPO" -p "$NAME" -D out --clobber
            echo "reused" > "out/$TAG_PREFIX.status"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare keystore
        if: steps.check.outputs.skip != 'true' && env.SIGNATURE == 'custom'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          set -euo pipefail
          : > ks_args.txt
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morphe.keystore"
            ENTRY_PW="${KEYSTORE_ENTRY_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
            printf '%s\n' --keystore "$RUNNER_TEMP/morphe.keystore" > ks_args.txt
            if [ -n "${KEYSTORE_PASSWORD:-}" ]; then printf '%s\n' --keystore-password "$KEYSTORE_PASSWORD" >> ks_args.txt; fi
            if [ -n "${KEYSTORE_ALIAS:-}" ]; then printf '%s\n' --keystore-entry-alias "$KEYSTORE_ALIAS" >> ks_args.txt; fi
            if [ -n "$ENTRY_PW" ]; then printf '%s\n' --keystore-entry-password "$ENTRY_PW" >> ks_args.txt; fi
            echo "Using keystore from secrets."
          else
            echo "::warning::KEYSTORE_BASE64 is not set: signing with a random key (still installs fine with signature verification disabled)."
          fi

      - name: Patch ${{ matrix.app }} (no GmsCore/MicroG)
        if: steps.check.outputs.skip != 'true'
        id: patch
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/${{ steps.check.outputs.name }}"

          # -d "GmsCore support" : no MicroG, keep the original package name
          # -d "Custom branding" : keep the original app icon & name
          PATCHED="$OUT"
          if [ "$SIGNATURE" = "original" ]; then PATCHED="out/unsigned.apk"; fi

          ARGS=(patch -p bins/patches.mpp -d "GmsCore support" -d "Custom branding" -o "$PATCHED" -r out/result.json --continue-on-error)
          if [ -n "$STRIPLIBS" ]; then ARGS+=(--striplibs "$STRIPLIBS"); fi
          if [ "$SIGNATURE" = "original" ]; then
            # Build unsigned, then put the stock APK's Google signing block back on it
            ARGS+=(--unsigned)
          else
            mapfile -t KS < ks_args.txt
            ARGS+=("${KS[@]}")
          fi

          java -jar bins/morphe.jar "${ARGS[@]}" "${{ steps.apk.outputs.file }}"

          if [ "$SIGNATURE" = "original" ]; then
            python3 -I bins/keep_original_signature.py "${{ steps.apk.outputs.file }}" "$PATCHED" "$OUT"
            rm -f "$PATCHED"
          fi

          [ -f "$OUT" ] || { echo "::error::Patched APK not found"; exit 1; }
          python3 -I bins/has_arch.py "$OUT" "$REQ_ARCH" \
            || { echo "::error::Patched APK is missing native libs for $REQ_ARCH"; exit 1; }
          sha256sum "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Write release notes for ${{ matrix.app }}
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          FAILED=$(jq -r '.failedPatches[]? | (.name // .patchName // tostring)' out/result.json 2>/dev/null || true)
          {
            echo "### $APP ${{ steps.apk.outputs.version }}"
            echo "Package: \`$PKG\`"
            if [ -n "$FAILED" ]; then
              echo; echo "⚠️ Patches that failed to apply:"; while read -r l; do echo "- $l"; done <<< "$FAILED"
            fi
          } > "out/$TAG_PREFIX.md"
          echo "built" > "out/$TAG_PREFIX.status"
          rm -f out/result.json

      - name: Upload ${{ matrix.app }}
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}
          path: out/
          retention-days: 3

  release:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      CLI_TAG: ${{ needs.plan.outputs.cli_tag }}
      PATCH_TAG: ${{ needs.plan.outputs.patch_tag }}
    steps:
      - name: Collect builds
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: out

      - name: Create one release for both apps
        env:
          GH_TOKEN: ${{ secrets.MORPHE_PAT }}
        run: |
          set -euo pipefail
          mkdir -p out && cd out
          ls -la

          if ! compgen -G './*.status' >/dev/null || ! grep -qx built ./*.status; then
            echo "Nothing new was built, no release needed."
            exit 0
          fi

          # An app that wasn't built this run (not selected, or its build failed)
          # is carried over from the latest release so the release always has both.
          for pat in 'YouTube-[0-9]*' 'YouTube-Music-*'; do
            if ! compgen -G "$pat.apk" >/dev/null; then
              gh release download -R "$RELEASE_REPO" -p "$pat.apk" -D . 2>/dev/null \
                && echo "Carried over $pat from the latest release" \
                || echo "No previous $pat to carry over"
            fi
          done

          YT=$(compgen -G 'YouTube-[0-9]*.apk' | head -n1 | sed -E 's/^YouTube-([^-]+)-.*/\1/' || true)
          YTM=$(compgen -G 'YouTube-Music-*.apk' | head -n1 | sed -E 's/^YouTube-Music-([^-]+)-.*/\1/' || true)

          TAG="morphe-${PATCH_TAG}"
          TITLE=""
          if [ -n "$YT" ]; then TAG="$TAG-yt-$YT"; TITLE="YouTube $YT"; fi
          if [ -n "$YTM" ]; then TAG="$TAG-ytm-$YTM"; TITLE="${TITLE:+$TITLE & }YouTube Music $YTM"; fi
          TITLE="$TITLE · Morphe $PATCH_TAG (Root)"

          {
            echo "**Morphe patches** $PATCH_TAG · CLI $CLI_TAG"
            echo
            echo "Settings entry: **$SETTINGS_TITLE**"
            echo
            echo "Root builds without MicroG. \`GmsCore support\` and \`Custom branding\` are disabled, so the package name, icon and app name stay original."
            if [ "${SIGNATURE}" = "original" ]; then
              echo "The APKs carry the original Google signature, so your account stays signed in across updates. Signature/digest verification has to be disabled on the device (CorePatch or similar)."
            else
              echo "Signed with a custom keystore. Install over the stock apps with signature verification disabled."
            fi
            echo
            echo "Native libs: ${STRIPLIBS:-YouTube universal (all architectures), YouTube Music arm64-v8a (Google ships no universal build of it)}"
            for id in youtube music; do
              name="YouTube"; [ "$id" = "music" ] && name="YouTube Music"
              [ -f "$id.md" ] && { echo; cat "$id.md"; }
              if [ -f "$id.status" ] && [ "$(cat "$id.status")" = "reused" ]; then
                echo; echo "_${name}: unchanged since the previous release._"
              fi
            done
            true
          } > notes.md

          gh release delete "$TAG" -R "$RELEASE_REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "$RELEASE_REPO" --latest \
            --title "$TITLE" --notes-file notes.md \
            ./*.apk
            
